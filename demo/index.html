<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iripo Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <div id="controls">
        <template shadowrootmode="open">
          <style>
            #form {
              display: grid;
              grid-template-columns: 1fr 1fr;
              gap: 1rem;
              p {
                grid-column: span 2;
              }
            }
            label {
              flex: 1;
              display: flex;
              flex-direction: column;
              gap: 1rem;
              button {
                margin-left: auto;
              }
              textarea {
                min-height: 5rem;
              }
            }
          </style>
          <h1>Iripo Demo</h1>
          <div id="form">
            <p>
              Add watcher/watchers within the "watcher" section, then add some
              matching HTML within the "add elements" section.
            </p>
            <form id="watcher-form">
              <label for="watcher">
                <div>Watcher</div>
                <textarea name="watcher">
iripo.in('button', node => {alert()})
            </textarea
                >
                <button type="submit">Create watcher</button>
              </label>
            </form>
            <form id="html-form">
              <label for="html">
                <div>Add elements</div>
                <textarea name="html"></textarea>
                <button type="submit">Create HTML</button>
              </label>
            </form>
          </div>
          <header>
            <h2>Generated elements</h2>
            <button type="reset">Clear all</button>
          </header>
        </template>
      </div>
    </div>

    <control-form></control-form>

    <div id="solid"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
